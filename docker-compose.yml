version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: file:/app/data/seucrm.db
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./server/data:/app/data
    # Sem "ports": só é alcançável dentro da rede do compose, via proxy
    # reverso do serviço "web". Para debug local, use
    # `docker compose exec backend sh` em vez de expor a porta.

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  redis_data:
