services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: file:/app/data/seucrm.db
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./server/data:/app/data
    # Sem "ports": só é alcançável dentro da rede do compose, via proxy
    # reverso do serviço "web". Para debug local, use
    # `docker compose exec backend sh` em vez de expor a porta.

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    # 8080 em vez de 80: essa VPS já roda outros apps atrás de um Traefik
    # que usa a porta 80/443. Usar 8080 evita conflito sem mexer no que já
    # está rodando. Acesso: http://SEU_IP:8080

volumes:
  redis_data:
